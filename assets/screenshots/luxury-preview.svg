<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="luxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181716"/>
      <stop offset="100%" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8c2c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#luxBg)"/>

  <!-- Minimal border frame -->
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="#2e2a24" stroke-width="1"/>

  <!-- Top bar -->
  <text x="400" y="65" font-family="Playfair Display, Georgia, serif" font-size="18" fill="#d4af37" letter-spacing="6" text-anchor="middle">ATELIER &amp; CO.</text>
  <line x1="280" y1="80" x2="520" y2="80" stroke="#3d372e" stroke-width="1"/>
  
  <text x="100" y="65" font-family="-apple-system, sans-serif" font-size="9" fill="#8c8273" letter-spacing="2">EDITION 2026</text>
  <text x="700" y="65" font-family="-apple-system, sans-serif" font-size="9" fill="#8c8273" letter-spacing="2" text-anchor="end">COLLECTION</text>

  <!-- Split layout mock -->
  <!-- Left: Image frame mockup -->
  <rect x="60" y="110" width="310" height="280" fill="#22201d" stroke="#3d372e" stroke-width="1"/>
  <rect x="75" y="125" width="280" height="250" fill="#1c1a17"/>
  <circle cx="215" cy="230" r="45" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="215" y="235" font-family="Playfair Display, serif" font-style="italic" font-size="14" fill="#a89a84" text-anchor="middle">Editorial Showcase</text>

  <!-- Right: Editorial Typography Mockup -->
  <text x="420" y="150" font-family="-apple-system, sans-serif" font-size="10" fill="#d4af37" letter-spacing="3">HAUTE COUTURE ARCHIVE</text>
  <text x="420" y="195" font-family="Playfair Display, Georgia, serif" font-size="34" fill="#f5f0eb" letter-spacing="1">The Art of</text>
  <text x="420" y="235" font-family="Playfair Display, Georgia, serif" font-size="34" font-style="italic" fill="#d4af37" letter-spacing="1">Elegance.</text>

  <rect x="420" y="260" width="300" height="10" rx="2" fill="#524b40" fill-opacity="0.6"/>
  <rect x="420" y="280" width="260" height="10" rx="2" fill="#524b40" fill-opacity="0.4"/>
  <rect x="420" y="300" width="220" height="10" rx="2" fill="#524b40" fill-opacity="0.3"/>

  <rect x="420" y="340" width="140" height="38" fill="none" stroke="#d4af37" stroke-width="1"/>
  <text x="490" y="364" font-family="-apple-system, sans-serif" font-size="10" fill="#d4af37" letter-spacing="2" text-anchor="middle">DISCOVER</text>

  <!-- Badge Overlay -->
  <rect x="295" y="398" width="210" height="32" rx="16" fill="#181716" fill-opacity="0.9" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d4af37" text-anchor="middle" letter-spacing="1">PROJECT IN DEVELOPMENT</text>
</svg>
