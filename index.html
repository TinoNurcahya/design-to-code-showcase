<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Design-to-Code Showcase | Frontend Implementation Archive</title>
    <meta
      name="description"
      content="An ultra-clean, visual-first archive of frontend implementations converting Figma, PSD, and visual designs into clean HTML, CSS, and JavaScript." />
    <meta name="author" content="Tino Nurcahya" />
    <meta
      name="keywords"
      content="Design to Code, Figma to HTML, PSD to HTML, CSS, JavaScript, Frontend Developer, Showcase" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Design-to-Code Showcase | Frontend Implementation Archive" />
    <meta
      property="og:description"
      content="Visual archive of responsive design-to-code implementations built with pure HTML5, CSS3, and JavaScript." />
    <meta property="og:image" content="./assets/screenshots/restaurant-preview.webp" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="./css/style.css?v=5.0" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Top Floating Pill Dock -->
    <header class="floating-dock" id="floating-dock" aria-label="Showcase Controls">
      <div class="dock-inner">
        <a href="#" class="dock-brand" aria-label="Design to Code Showcase Home">
          <span class="dock-badge" aria-hidden="true">&lt;/&gt;</span>
          <span class="dock-title">Design<span>→</span>Code</span>
        </a>

        <div class="dock-divider" aria-hidden="true"></div>

        <div class="dock-counter" id="project-count" aria-label="Total projects count">
          <span class="dock-pulse-dot" aria-hidden="true"></span>
          <span class="dock-count-text">3 Projects</span>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <div class="dock-actions">
          <button
            id="theme-toggle"
            class="dock-icon-btn"
            type="button"
            aria-label="Switch between dark and light mode"
            title="Switch theme">
            <svg
              class="theme-icon-sun"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="theme-icon-moon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <a
            href="https://github.com/TinoNurcahya/design-to-code-showcase"
            target="_blank"
            rel="noopener noreferrer"
            class="dock-icon-btn"
            aria-label="View source repository on GitHub"
            title="GitHub Repository">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Visual Gallery (Bento Grid) -->
    <main id="main-content" class="gallery-wrapper">
      <div class="gallery-container">
        <div class="projects-grid" id="project-grid" aria-live="polite">
          <!-- Populated dynamically by script.js -->
        </div>
      </div>
    </main>

    <!-- Ultra Minimal Footer -->
    <footer class="minimal-footer">
      <div class="footer-container">
        <p class="footer-copy">© <span id="currentYear">2026</span> Tino Nurcahya · Design-to-Code Showcase</p>
        <span class="footer-tech">Pure HTML · CSS · JavaScript</span>
      </div>
    </footer>

    <script src="./js/script.js?v=5.0"></script>
  </body>
</html>
